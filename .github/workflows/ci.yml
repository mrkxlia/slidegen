name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python tests (本体 + DSL リファレンス整合ガード)
        run: uv run --extra dev pytest tests/ -q

      - name: Build wheel (パッケージング退行の検知)
        run: uv build

      - name: Agent Skill validation (skills-ref)
        run: >
          uvx --from
          "git+https://github.com/agentskills/agentskills@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
          skills-ref validate skills/slidegen
