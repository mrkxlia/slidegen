name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: python -m pip install --upgrade pip build python-pptx pytest

      - name: Python tests (本体 + chart-DSL ガード)
        run: PYTHONPATH=. python -m pytest tests/ -q

      - name: Build slidegen wheel (frontend/public/wheels + .env.local)
        run: bash tools/build_wheel.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Gateway — install, typecheck, test
        working-directory: gateway
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run

      - name: Frontend — install, typecheck, test, build
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run
          npm run build
