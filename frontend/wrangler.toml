# frontend/wrangler.toml — Cloudflare Pages（静的 + functions/ の Pages Functions）設定。
#
# 本番は Pages 一本に集約: 静的アセット(dist) と /api(=functions/api/[[path]].ts→gateway)
# を同一オリジンで配信し、Pages プロジェクトに Cloudflare Access をかける。
# デプロイ: npm run build && npx wrangler pages deploy dist --project-name slidegen
name = "slidegen"
pages_build_output_dir = "dist"
compatibility_date = "2024-12-05"
compatibility_flags = ["nodejs_compat"]

# Workers AI（無料枠）。Pages Functions でも binding を利用できる。
# 移植先(Workers AI 非対応)では providers 側の workers_ai を catalog から外す。
[ai]
binding = "AI"

[vars]
# 公開してよい設定のみ。秘密は `wrangler pages secret put <NAME> --project-name slidegen` で投入:
#   GEMINI_API_KEY / OPENROUTER_API_KEY / OPENAI_API_KEY / ANTHROPIC_API_KEY
# ALLOWED_ORIGIN: 同一オリジン運用では CORS 判定に実質効かないが、Hono cors の origin に使う。
#   実際の Pages URL に合わせる（プロジェクト名が取得済みだと *.pages.dev が変わる点に注意）。
ALLOWED_ORIGIN = "https://slidegen.pages.dev"
# ACCESS_TEAM_DOMAIN: Zero Trust チーム名（例 "myteam" → https://myteam.cloudflareaccess.com）。
ACCESS_TEAM_DOMAIN = ""
# ACCESS_AUD: Access アプリの Application Audience (AUD) タグ。
#   未設定だと auth はフェイルクローズ（全リクエスト 500）。本番では必ず設定。
ACCESS_AUD = ""
# 入力サイズ上限（バイト）。本番キーの暴走課金防止のサーバ強制ガード。
MAX_INPUT_BYTES = "200000"
# レート制限: 時間窓(秒)あたりの最大リクエスト数。
RATE_WINDOW_SEC = "60"
RATE_MAX_REQUESTS = "30"
# 本番では認証バイパスを絶対に有効化しない（ローカルは gateway/.dev.vars 側で "1"）。
DEV_BYPASS_AUTH = "0"

# 複数 isolate 横断のレート制限を効かせるなら KV を作成してバインド:
#   npx wrangler kv namespace create RL
# [[kv_namespaces]]
# binding = "RL"
# id = "<上記コマンドで発行される id>"
